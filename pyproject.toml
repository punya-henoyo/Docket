[project]
name = "docket"
version = "0.1.0"
description = "Autonomous pentesting agent: multi-agent exploitation with proof-of-concept evidence"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai-agents[litellm]>=0.19,<0.20",
    "pydantic>=2",
    "python-dotenv>=1",
    "textual>=8.2.8",
]

[project.optional-dependencies]
# Real token counting for pre-flight context sizing (llm/context_budget.py). Optional
# because the character fallback keeps a scan running without it; worth installing
# because that fallback is ~40% off on the JSON/HTTP an agent conversation is made of.
tokenizer = ["tokenizers>=0.20"]

[project.scripts]
docket = "docket.interface.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Source lives under engine/, so name the path; hatchling ships it as the `docket`
# package regardless of the wrapper directory (which is never imported).
packages = ["engine/docket"]
