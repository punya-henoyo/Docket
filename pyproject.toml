[project]
name = "docket"
version = "0.1.0"
description = "Autonomous pentesting agent: multi-agent exploitation with proof-of-concept evidence"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai-agents[litellm]>=0.19,<0.20",
    "pydantic>=2",
    "python-dotenv>=1",
    "textual>=8.2.8",
]

[project.optional-dependencies]
# The demo app in app/ is not part of the tool. Kept an optional extra so installing
# docket does not drag a web framework in: `uv sync --extra app`.
app = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    # Reading an uploaded compliance policy that arrives as a PDF. Pure Python, no
    # compiled extensions. Here rather than in the core dependencies because a scan does
    # not need it: .md, .txt and .docx are all read with the standard library (a .docx is
    # a zip of XML), and compliance/ingest.py refuses a PDF with an actionable message
    # rather than returning empty text when this is absent.
    "pypdf>=5",
]
# Real token counting for pre-flight context sizing (llm/context_budget.py). Optional
# because the character fallback keeps a scan running without it; worth installing
# because that fallback is ~40% off on the JSON/HTTP an agent conversation is made of.
tokenizer = ["tokenizers>=0.20"]

[project.scripts]
docket = "docket.interface.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Source lives under engine/, so name the path; hatchling ships it as the `docket`
# package regardless of the wrapper directory (which is never imported).
packages = ["engine/docket"]
