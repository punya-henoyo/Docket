[project]
name = "docket"
version = "0.1.0"
description = "Lab-scale autonomous pentesting agent, Docket-style, targeting vulnshop"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai-agents[litellm]>=0.19,<0.20",
    "pydantic>=2",
    "python-dotenv>=1",
]

[project.scripts]
docket = "docket.interface.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["docket"]
